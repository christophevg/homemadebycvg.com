  coffin-gift-box:
    title: Coffin Gift Box
    description: |
      It doesn’t always require rocket science to make a gift more personal. Sometimes, a little attention to the wrapping can make all the difference.

      I happen to have a friend who is absolutely obsessed with Halloween. She has more Halloween decorations than all Belgian amusement parks combined. No, I’m not exaggerating! 🎃

      When she organized a Halloween party at her house this year, I couldn’t resist bringing a gift. Over the past few years, I’ve regularly been making personalized and custom gift wrapping on several occasions. So, what better gift than a coffin for a Halloween party present?! 💀
    info: https://christophe.vg/makes/Coffin-Gift-Box
    image: https://christophe.vg/makes/images/header/coffin-gift-box.jpeg
    instagram: https://www.instagram.com/p/DQ7h5bGDM2K
    when: 31 october 2025

  formula-of-architecture:
    kind: writing
    title: The Formula of Architecture
    description: |
      Do you possess the necessary capabilities to drive your business to
      success? Are you equipped with the required processes, the right people,
      information, and technology? Or at the very least, do you have a clear
      understanding of what these elements are, or even what they should be?

      With the Formula of Architecture, I’ve finally articulated my perspective
      on capabilities and their appropriate interpretation within the context
      of Enterprise Architecture. I’ve also explored their internal structure
      and the implications of applying them effectively.
    read: https://christophe.vg/about/Formula-of-Architecture
    image: https://christophe.vg/about/images/header/formula-of-architecture.png
    instagram: https://www.instagram.com/p/DKhwfP2I3bH
    when: 5 june 2025

  nation-of-positivity:
    title: Nation of Positivity
    description: |
      Bij Nation of Positivity vind je veel kleine leuke cadeautjes. Allemaal
      gepersonaliseerd en bedoeld om jouw positiviteit aan iemand anders te
      geven.

      Velen van jullie hebben de afgelopen jaren al een klein extraatje van mij
      gekregen. Ze waren altijd zelfgemaakt, gepersonaliseerd, uniek voor jou.
      Het was leuk om de soms wat verbaasde, maar altijd vooral heel dankbare
      reacties te zien. Want we hoeven niet allemaal een raket naar Mars te
      lanceren. Soms begint een beetje positiviteit gewoon bij jou en mij.

      Met Nation of Positivity bied ik mijn atelier en mijn eigen werk aan in
      een kleine online shop; mijn bescheiden initiatief, mijn
      spreekwoordelijke duit in het zakje. Met liefde gemaakt om met heel veel
      liefde te kunnen geven. Samen zorgen we voor een beetje meer positiviteit
      in de wereld.
    run: https://nationofpositivity.com
    image: https://christophe.vg/about/images/banner/cv-nationofpositivity.png
    instagram: https://www.instagram.com/NationOfPositivity
    when: 28 oktober 2024

  virtue-of-tech-agnosticism:
    kind: writing
    title: The Virtue of Technology Agnosticism
    description: |
      When I tell people that I am technology agnostic, they open their eyes a
      little bit more. Usually something along the lines of: “But Christophe,
      you’ve been programming longer than I’ve been alive, you have more
      hardware devices in your home than I’ve ever heard of, and your personal
      software development library contains books older than some papyrus in
      the museum of ancient history. How on earth can you, of all people, be
      technology agnostic?”
      And, you know, the problem is, they are right, in a way.
    read: https://christophe.vg/about/Virtue-of-Technology-Agnosticism
    image: https://christophe.vg/about/images/header/virtue-of-technology-agnosticism.png
    instagram: https://www.instagram.com/p/DA2wQdxs5AX
    when: 2 october 2024

