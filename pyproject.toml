[project]
name = "homemadebycvg-com"
version = "0.1.0"
description = "Simple Social Landing Page for Homemade by CVG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=20.1.0",
    "markdown>=3.10.3",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["clevis"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
